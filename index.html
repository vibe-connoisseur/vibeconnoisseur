<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11120f" />
    <meta name="description" content="London's parties, day parties, brunches and concerts on one map. Filter by date, type, age and area." />
    <title>Where's The Vibe | London Event Map</title>
    <link rel="preload" href="assets/fonts/norwester.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="styles.css?v=12" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="site-header">
        <div class="header-left">
          <button class="menu-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
            <span></span><span></span><span></span>
          </button>
          <a class="wordmark" href="#top" aria-label="Vibe Connoisseur home">
            <img src="assets/vibe-connoisseur-logo.png" alt="The Vibe Connoisseur" />
            <span class="wordmark-name"><strong>Vibe</strong><strong>Connoisseur</strong></span>
          </a>
        </div>
        <div class="live-status header-status" id="syncStatus" role="status" aria-live="polite">
          <span class="status-pulse"></span>
          <span>Reading the guest list</span>
        </div>
        <button class="refresh-button" id="refreshButton" type="button" aria-label="Refresh events">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.3 9A7 7 0 0 0 6.1 6.1L4 8m16 8-2.1 1.9A7 7 0 0 1 5.7 15" /></svg>
          <span>Refresh</span>
        </button>
      </header>

      <nav class="top-tabs" id="topTabs" aria-label="Sections">
        <a href="#discover" data-tab="discover" class="is-active">Discover</a>
        <a href="#tonight" data-tab="tonight">Tonight</a>
        <a href="#weekend" data-tab="weekend">This weekend</a>
        <a href="#following" data-tab="following">Following</a>
        <a href="#map" data-tab="map">Map</a>
        <a href="#search" data-tab="search" class="tab-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 5 5" /></svg>Search</a>
      </nav>

      <main id="top">
        <section class="view" id="view-discover" data-view="discover">
          <section class="news" id="newsSection" aria-labelledby="newsTitle" hidden>
            <div class="section-head">
              <h2 id="newsTitle">Vibe News</h2>
              <div class="news-filters" id="newsFilters" role="tablist" aria-label="News type"></div>
            </div>
            <div class="news-rail" id="newsRail"></div>
          </section>
          <div class="flyer-showcases" id="flyerShowcases"></div>
          <section class="event-feed" id="discoverFeed" aria-label="Coming up"></section>
        </section>

        <section class="view" id="view-tonight" data-view="tonight" hidden>
          <div class="event-feed" id="tonightFeed"></div>
        </section>

        <section class="view" id="view-weekend" data-view="weekend" hidden>
          <div class="event-feed" id="weekendFeed"></div>
        </section>

        <section class="view" id="view-following" data-view="following" hidden>
          <div id="followingView"></div>
        </section>

        <section class="view" id="view-search" data-view="search" hidden>
          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 5 5" /></svg>
            <span class="sr-only">Search</span>
            <input type="search" id="searchInput" placeholder="Events, venues, postcodes, DJs" autocomplete="off" enterkeyhint="search" />
          </label>
          <div id="searchResults"></div>
        </section>

        <section class="view" id="view-saved" data-view="saved" hidden>
          <div class="event-feed" id="savedFeed"></div>
        </section>

        <section class="view" id="view-map" data-view="map" hidden>

        <section class="filter-bar" aria-label="Filter London events">
          <div class="filter-heading">
            <button id="clearFilters" type="button">Reset all</button>
          </div>
          <label class="select-wrap search-wrap">
            <span>Search</span>
            <input type="text" id="searchInput" placeholder="Search by name, place, genre…" autocomplete="off" />
          </label>
          <label class="select-wrap">
            <span>Date</span>
            <select id="dateFilter"><option value="all">All dates</option></select>
          </label>
          <div class="select-wrap multiselect">
            <span>Event type</span>
            <button type="button" class="multiselect-toggle" id="typeFilterToggle" aria-expanded="false" aria-haspopup="listbox">All event types</button>
            <div class="multiselect-panel" id="typeFilterPanel" hidden></div>
          </div>
          <label class="select-wrap">
            <span>Age range</span>
            <select id="ageFilter"><option value="all">All age ranges</option></select>
          </label>
          <div class="select-wrap multiselect">
            <span>Location</span>
            <button type="button" class="multiselect-toggle" id="locationFilterToggle" aria-expanded="false" aria-haspopup="listbox">All London</button>
            <div class="multiselect-panel" id="locationFilterPanel" hidden></div>
          </div>
        </section>

        <section class="map-section" aria-label="Event map and results">
          <div class="map-panel">
            <div id="map" aria-label="Interactive map of London event locations"></div>
            <div class="gesture-hint" id="gestureHint" aria-hidden="true">
              <svg viewBox="0 0 40 40"><path d="M15 15 9 9m0 0v6m0-6h6M25 25l6 6m0 0v-6m0 6h-6" /></svg>
              <span>Pinch to zoom</span>
            </div>
            <div class="map-key" id="mapKey" aria-label="Event type key"></div>
            <div class="map-tools">
              <button class="map-tool" id="nearMeButton" type="button" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3m0 14v3M2 12h3m14 0h3" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="1.6" /></svg>
                <span>Near me</span>
              </button>
              <button class="map-tool" id="savedButton" type="button" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2Z" /></svg>
                <span>Saved</span><strong id="savedCount">0</strong>
              </button>
            </div>
            <button class="mobile-list-button" id="mobileListButton" type="button" aria-expanded="false">
              <span>Browse events</span><strong id="mobileCount">0</strong>
            </button>
          </div>

          <aside class="event-rail" id="eventRail" aria-label="Matching events">
            <div class="rail-heading">
              <p><span id="resultCount">0</span> <span id="railTitle">selected</span></p>
              <button id="closeRail" type="button" aria-label="Close event list">Close</button>
            </div>
            <div class="event-list" id="eventList"></div>
          </aside>
        </section>

        <section class="empty-state" id="emptyState" hidden>
          <span>No signal</span>
          <h2 id="emptyTitle">Nothing matches that combination.</h2>
          <button type="button" id="emptyReset">Clear the filters</button>
        </section>
        </section>
      </main>

      <footer>
        <p>Made for plans that leave the group chat.</p>
        <p><a class="footer-signup" href="privacy.html">Privacy</a> / <a class="footer-signup" href="terms.html">Terms</a></p>
      </footer>
    </div>

    <div class="sheet-overlay" id="sheetOverlay" hidden>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Profile">
        <div class="sheet-head">
          <button class="sheet-back" id="sheetBack" type="button">&larr; Back</button>
          <p class="sheet-title" id="sheetTitle"></p>
          <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </section>
    </div>

    <div class="detail-overlay" id="detailOverlay" hidden>
      <section class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <button class="detail-close" id="detailClose" type="button" aria-label="Close event details">&times;</button>
        <div class="detail-body" id="detailBody"></div>
      </section>
    </div>

    <div class="drawer-overlay" id="drawerOverlay" hidden></div>
    <aside class="drawer" id="drawer" aria-label="Menu" aria-hidden="true">
      <div class="drawer-head">
        <button class="drawer-back" id="drawerBack" type="button" hidden>&larr; Back</button>
        <p class="drawer-title" id="drawerTitle">Menu</p>
        <button class="drawer-close" id="drawerClose" type="button" aria-label="Close menu">&times;</button>
      </div>
      <div class="drawer-content" id="drawerContent"></div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="assets/vendor/supabase.js?v=2.119.0" defer></script>
    <script src="native.js?v=2" defer></script>
    <script src="app.js?v=13" defer></script>
    <script src="account.js?v=5" defer></script>
    <script src="social.js?v=2" defer></script>
    <script src="views.js?v=5" defer></script>
  </body>
</html>
